name: Bug Report
description: Report a crash, incorrect behavior, or other problem with Supernova.
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: build
    attributes:
      label: Supernova Build
      description: What build number of Supernova are you using?
      placeholder: "e.g. 0.1.42"
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game
      description: Which game were you editing when the issue occurred?
      options:
        - Super Mario Galaxy 1
        - Super Mario Galaxy 2
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you running Supernova on?
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What were you doing?
      description: Describe what you were doing immediately before the issue occurred.
      placeholder: |
        I opened HeavenlyBeachGalaxy and selected the Launch Star.
        I then attempted to move it using the position gizmo.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps needed to reproduce the issue.
      placeholder: |
        1. Open Supernova
        2. Open HeavenlyBeachGalaxy
        3. Select the Launch Star
        4. Enable the position gizmo
        5. Move the object
        6. Supernova crashes
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Does this happen every time?
      description: How consistently can you reproduce the issue?
      options:
        - Every time
        - Sometimes
        - Only happened once
        - Unsure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: Describe what you expected Supernova to do instead.
      placeholder: |
        The Launch Star should have moved with the gizmo without crashing.
    validations:
      required: true

  - type: textarea
    id: crash-log
    attributes:
      label: Crash Log
      description: If Supernova crashed, paste the crash log generated by Supernova here.
      render: text
      placeholder: Paste the crash log here...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else that might help reproduce or understand the issue.
      placeholder: |
        This happens every time I try to move this object.
        The issue does not occur in other galaxies.
    validations:
      required: false